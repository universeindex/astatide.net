<!DOCTYPE html>

<html>

  <head>
    <title>astatide</title>
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
  </head>

  <style>
html, body {
  margin: 0;
  padding: 0;
}

#mainbg {
  image-rendering: pixelated;
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
  background-image: url('front_page_bg.png');

  height: 100vh;
  margin: 0;
  padding: 0;

  border-collapse: collapse;
  border-spacing: 0;

  display: flex;
  justify-content: center;
  align-items: center;
}
  </style>

  <body>
    <div id="mainbg">
      <div id="astwindow" class="window" style="width: 65vw; height: 80vh; position: center">
        <div class="title-bar">
          <div class="title-bar-text">astatide.net</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <div style="display: grid; grid-template-columns: 20% 80%;">
            <div>
              <img src="astatidenet.png" style="width: 100%"></img>
              <ul class="tree-view">
                <li>
                  Barracuda Engine
                  <ul>
                    <li>Barracuda Engine</li>
                    <li>Documentation</li>
                    <li><a href="https://github.com/universeindex/barracuda">Github</a></li>
                  </ul>
                  </li>
              </ul>
            </div>
            <div style="margin-left: 16px;">
              <h3 style="font-weight: bold; font-style: italic">welcome</h3>
              <p>The fog is coming</p>
            <div>
          </div>
          <p>this website is under construction</p>
        </div>
      </div>
    </div>
  </body>

</html>
